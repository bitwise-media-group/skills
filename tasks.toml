#
# Repo-local tasks layered on the agent-plugins archetype (included after it
# from the root mise.toml, so the lint redefinition below wins). The helpers
# port the old Makefile's extras: `claude plugin validate` runs the claude
# CLI as a task-scoped mise tool (a native release binary from the aqua
# registry, checksum-verified — no npm, no node_modules; task-scoped like
# dotty/evolve so it never shadows a developer's own claude on the activated
# PATH), the eval fixtures must be valid JSON (checked with the pinned node —
# no jq dependency), and the installer must parse. The claude pin is exact
# and bumped by hand: task-scoped tools sit outside mise.lock and
# `mise upgrade --bump`, and dependabot no longer sees it without a
# package.json.

[plugin-validate]
hide = true
dir = "{{config_root}}"
tools = { "aqua:anthropics/claude-code" = "2.1.224" }
run = "claude plugin validate ."

[fixture-json]
hide = true
dir = "{{config_root}}"
run = """
set -eu
for f in plugins/*/evals/*/*.json; do
  [ -e "$f" ] || continue
  node -e 'JSON.parse(require("fs").readFileSync(process.argv[1]))' "$f" \
    || { echo "invalid JSON: $f"; exit 1; }
done
"""

[installer-syntax]
hide = true
dir = "{{config_root}}"
run = "sh -n install.sh"

# The archetype gate plus the repo-local checks above.
[lint]
description = "prose lint + license check + evolve checks + plugin validate + fixture/installer checks"
run = [
  { task = "license-check" },
  { task = "lint-containers" },
  { task = "lint-shell" },
  { task = "lint-prose" },
  { task = "evolve-checks" },
  { task = "plugin-validate" },
  { task = "fixture-json" },
  { task = "installer-syntax" }
]
