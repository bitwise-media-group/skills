#
# Repo-local tasks, included after the toolchain library's common/tasks.toml
# (the .mise/ submodule). This file supplies everything specific to a
# plugin/marketplace repo: the evolve eval suite (reading .evolve.json at the
# root) and the plugin/marketplace checks ported from the old Makefile —
# `claude plugin validate` runs the claude CLI as a pinned mise tool (a native
# release binary resolved via mise's `github:` backend directly against the
# GitHub release, checksum- and attestation-verified — no npm, no
# node_modules; see mise.toml for why it's `github:anthropics/claude-code`
# rather than `aqua:`), the eval fixtures must be valid JSON (checked with the
# pinned node — no jq dependency), and the installer must parse.
#
# Task merging is whole-task replacement with later includes winning, so the
# lint/ci/pr redefinitions below repeat common's rollups and append this
# repo's checks; fmt is common's unchanged.
#
# The eval tiers keep their old Makefile names (triggers/evals/all/report)
# and default to --new --modified: full runs are LLM-priced, so the sweep is
# opt-in via `evolve` directly rather than a task default.
#
# evolve and claude-code are both pinned in the root mise.toml [tools] (see
# that file's header), so every task below can just call them directly and
# both pins are covered by the root mise.lock.
#
# The docs site is Zensical via uv (the toolchain library pins uv): sync /
# docs-build / serve mirror the toolchain archetypes' zensical tasks, and
# docs-gen renders the plugin, skill and evaluation pages from the repo
# (scripts/gen-docs.py — stdlib only). `build` is the canonical task the
# reusable CI discovers, so every PR builds the site; `lint` fails when the
# generated pages are stale or missing from zensical.toml's nav.

[evolve-checks]
hide = true
dir = "{{config_root}}"
run = "evolve run checks --strict"

[plugin-validate]
hide = true
dir = "{{config_root}}"
run = "claude plugin validate ."

[fixture-json]
hide = true
dir = "{{config_root}}"
run = """
set -eu
for f in plugins/*/evals/*/*.json; do
  [ -e "$f" ] || continue
  node -e 'JSON.parse(require("fs").readFileSync(process.argv[1]))' "$f" \
    || { echo "invalid JSON: $f"; exit 1; }
done
"""

[installer-syntax]
hide = true
dir = "{{config_root}}"
run = "sh -n install.sh"

# Zensical documentation site (Python via uv). `uv sync` provisions Python +
# zensical from pyproject.toml / uv.lock; the built site/ is git-ignored.
[sync]
hide = true
dir = "{{config_root}}"
run = "uv sync"

[docs-gen]
description = "regenerate the generated docs pages (plugins, skills, evaluation) from the repo"
dir = "{{config_root}}"
run = "uv run python scripts/gen-docs.py"

[docs-check]
hide = true
dir = "{{config_root}}"
run = "uv run python scripts/gen-docs.py --check"

[docs-build]
description = "build the documentation site (zensical)"
dir = "{{config_root}}"
depends = ["sync"]
run = "uv run zensical build"

[serve]
description = "serve the docs site locally (zensical) at http://localhost:8002/skills/"
dir = "{{config_root}}"
depends = ["sync"]
run = "uv run zensical serve"

[docs]
description = "regenerate the generated docs pages, then build the site"
run = [{ task = "docs-gen" }, { task = "docs-build" }]

[build]
description = "build the documentation site (the reusable CI's build leg)"
run = [{ task = "docs-build" }]

# common's lint rollup, plus the plugin/marketplace and generated-docs checks.
[lint]
description = "prose lint + license, container, shell and workflow checks, plus evolve, plugin, fixture, installer and generated-docs checks"
run = [
  { task = "license-check" },
  { task = "lint-containers" },
  { task = "lint-shell" },
  { task = "lint-workflows" },
  { task = "lint-prose" },
  { task = "evolve-checks" },
  { task = "plugin-validate" },
  { task = "fixture-json" },
  { task = "installer-syntax" },
  { task = "docs-check" },
]

[test]
description = "validate the plugins and that eval results meet the minimum thresholds"
dir = "{{config_root}}"
run = [
  "evolve run checks",
  "evolve report --check --junit=coverage/junit.xml --cobertura=coverage/cobertura-coverage.xml"
]

[triggers]
description = "tier 1 — trigger accuracy + token usage (new/modified)"
dir = "{{config_root}}"
run = "evolve run triggers --new --modified"

[evals]
description = "tier 2 — behavioral evals + token usage (new/modified)"
dir = "{{config_root}}"
run = "evolve run evals --new --modified"

[all]
description = "all eval tiers, then regenerate reports and the docs pages"
dir = "{{config_root}}"
run = ["evolve run all --new --modified", { task = "docs-gen" }]

# docs-gen follows so fresh results reach the site's evaluation pages and the
# landing's stat row.
[report]
description = "regenerate the EVALUATION files from stored results, then the docs pages"
dir = "{{config_root}}"
run = ["evolve report", { task = "docs-gen" }]

[ci]
description = "the gates the reusable CI workflow runs"
run = [{ task = "lint" }, { task = "test" }, { task = "build" }]

[pr]
description = "full local gate before a pull request"
run = [{ task = "docs-gen" }, { task = "fmt" }, { task = "lint" }, { task = "test" }]
