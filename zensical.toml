#
# bitwise skills — Zensical configuration
# https://zensical.org/docs/setup/basics/
#
# Skinned with the parent brand's terracotta theme (copied from the org site,
# bitwise-media-group.github.io): overrides/ + docs/stylesheets/extra.css.
# The plugin, skill and evaluation pages under docs/plugins/ (and
# docs/evaluation.md) are GENERATED by scripts/gen-docs.py from SKILL.md, the
# manifests and evolve's reports — `make docs-gen` regenerates them, and
# `make lint` fails if they're stale or a generated page is missing from `nav`
# below (the generator prints the expected Plugins section).
#
# The reusable release workflow builds this site at each release tag
# (`uv run zensical build`) and publishes it to GitHub Pages.

[project]
site_name = "bitwise skills"
site_description = "Bitwise Media Group skills and plugins for coding agents — written once as SKILL.md, installed into Claude Code, Codex CLI, OpenCode and Antigravity, and evaluated per model."
site_url = "https://oss.bitwisemedia.uk/skills/"
repo_url = "https://github.com/bitwise-media-group/skills"
repo_name = "bitwise-media-group/skills"
# The `#__consent` link re-opens the cookie consent dialog so visitors can
# change their choice at any time (see [project.extra.consent] below).
copyright = '© 2026 Bitwise Media Group Ltd — <a href="#__consent">Change cookie settings</a>'
# 8001 is dotty's docs site; keep them side by side.
dev_addr = "localhost:8002"

# Paths are relative to docs_dir (default: "docs")
extra_css = ["stylesheets/extra.css"]

nav = [
  { "Home" = "index.md" },
  { "Install" = "install.md" },
  { "Plugins" = [
    { "golang" = [
      "plugins/golang/index.md",
      { "go-docs" = "plugins/golang/go-docs/index.md" },
      { "go-project" = "plugins/golang/go-project/index.md" },
      { "go-release" = ["plugins/golang/go-release/index.md", { "Reference" = "plugins/golang/go-release/reference.md" }] },
      { "go-style" = ["plugins/golang/go-style/index.md", { "Reference" = "plugins/golang/go-style/reference.md" }] },
      { "go-testing" = "plugins/golang/go-testing/index.md" },
      { "Evaluation" = "plugins/golang/evaluation.md" },
    ] },
    { "terraform" = [
      "plugins/terraform/index.md",
      { "terraform-module" = "plugins/terraform/terraform-module/index.md" },
      { "terraform-style" = ["plugins/terraform/terraform-style/index.md", { "Reference" = "plugins/terraform/terraform-style/reference.md" }] },
      { "terraform-validate" = "plugins/terraform/terraform-validate/index.md" },
      { "Evaluation" = "plugins/terraform/evaluation.md" },
    ] },
    { "actions" = [
      "plugins/actions/index.md",
      { "actions-reusable-workflows" = ["plugins/actions/actions-reusable-workflows/index.md", { "Reference" = "plugins/actions/actions-reusable-workflows/reference.md" }] },
      { "actions-security" = ["plugins/actions/actions-security/index.md", { "Reference" = "plugins/actions/actions-security/reference.md" }] },
      { "actions-style" = ["plugins/actions/actions-style/index.md", { "Reference" = "plugins/actions/actions-style/reference.md" }] },
      { "actions-validate" = "plugins/actions/actions-validate/index.md" },
      { "Evaluation" = "plugins/actions/evaluation.md" },
    ] },
    { "python" = [
      "plugins/python/index.md",
      { "python-docs" = "plugins/python/python-docs/index.md" },
      { "python-project" = "plugins/python/python-project/index.md" },
      { "python-release" = ["plugins/python/python-release/index.md", { "Reference" = "plugins/python/python-release/reference.md" }] },
      { "python-style" = ["plugins/python/python-style/index.md", { "Reference" = "plugins/python/python-style/reference.md" }] },
      { "python-testing" = "plugins/python/python-testing/index.md" },
      { "python-typing" = ["plugins/python/python-typing/index.md", { "Reference" = "plugins/python/python-typing/reference.md" }] },
      { "Evaluation" = "plugins/python/evaluation.md" },
    ] },
    { "workflow" = [
      "plugins/workflow/index.md",
      { "workflow-commit" = ["plugins/workflow/workflow-commit/index.md", { "Reference" = "plugins/workflow/workflow-commit/reference.md" }] },
      { "workflow-new-repository" = "plugins/workflow/workflow-new-repository/index.md" },
      { "workflow-security-report" = ["plugins/workflow/workflow-security-report/index.md", { "Reference" = "plugins/workflow/workflow-security-report/reference.md" }] },
      { "workflow-skill-evals" = ["plugins/workflow/workflow-skill-evals/index.md", { "Reference" = "plugins/workflow/workflow-skill-evals/reference.md" }] },
      { "workflow-toolchain" = "plugins/workflow/workflow-toolchain/index.md" },
      { "Evaluation" = "plugins/workflow/evaluation.md" },
    ] },
  ] },
  { "Evaluation" = "evaluation.md" },
  { "Contributing" = "contributing.md" },
]

[project.theme]
name = "material"
custom_dir = "overrides"
favicon = "assets/logo-mark.svg"
features = [
  "navigation.instant",
  "navigation.tracking",
  "navigation.sections",
  "navigation.indexes",
  "navigation.top",
  "navigation.footer",
  "content.code.copy",
  "content.code.annotate",
  "search.suggest",
  "search.highlight",
  "toc.follow",
]

[project.theme.font]
text = "Hanken Grotesk"
code = "JetBrains Mono"

[project.theme.icon]
repo = "fontawesome/brands/github"

# Palette toggle for automatic mode
[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle.icon = "lucide/sun-moon"
toggle.name = "Switch to light mode"

# Palette toggle for light mode
[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

# Palette toggle for dark mode
[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to system preference"

[project.extra]
generator = false
# Preference storage (the cookie-consent choice, colour palette, …) is keyed
# by this scope, which defaults to the site's own subpath. Every site under
# oss.bitwisemedia.uk sets "/" so one consent answer applies domain-wide.
scope = "/"

[[project.extra.social]]
icon = "fontawesome/brands/github"
link = "https://github.com/bitwise-media-group/skills"

[[project.extra.social]]
icon = "fontawesome/brands/youtube"
link = "https://www.youtube.com/@bitwise-media-group"

[[project.extra.social]]
icon = "fontawesome/brands/x-twitter"
link = "https://x.com/BitWiseMedia"

[[project.extra.social]]
icon = "fontawesome/brands/instagram"
link = "https://www.instagram.com/bitwisemediagroup"

[[project.extra.social]]
icon = "fontawesome/brands/tiktok"
link = "https://www.tiktok.com/@bitwisemediagroup"

[[project.extra.social]]
icon = "fontawesome/brands/bluesky"
link = "https://bsky.app/profile/bitwisemediagroup.bsky.social"

# Google Analytics 4. https://zensical.org/docs/setup/analytics/#configuration
# The analytics snippet only renders when `property` is non-empty, so the build
# stays clean until the measurement ID is available. Loading is also gated on
# the visitor accepting the `analytics` cookie in the consent dialog below.
[project.extra.analytics]
provider = "google"
property = "G-Y34HV8TX89"

# Cookie consent / GDPR. https://zensical.org/docs/setup/data-privacy/
# Re-openable any time via the "Change cookie settings" footer link (copyright,
# above). The `analytics` toggle controls Google Analytics; `github` controls
# the repo/social API calls Material makes for the GitHub integration.
[project.extra.consent]
title = "Cookie consent"
description = """
We use cookies to recognise your repeated visits and preferences, and to \
measure whether visitors find what they're looking for. With your consent, \
you're helping us make this site better.
"""
actions = ["accept", "reject", "manage"]

[project.extra.consent.cookies]
analytics = "Google Analytics"
github = "GitHub"

# Markdown extensions. Declaring this section replaces Zensical's built-in
# defaults wholesale, so the block below mirrors them verbatim and adds
# pymdownx.snippets, which lets pages include other files with the
# `--8<-- "path"` marker (base_path is relative to docs_dir).
# https://zensical.org/docs/setup/extensions/
[project.markdown_extensions.abbr]

[project.markdown_extensions.admonition]

[project.markdown_extensions.attr_list]

[project.markdown_extensions.def_list]

[project.markdown_extensions.footnotes]

[project.markdown_extensions.md_in_html]

[project.markdown_extensions.toc]
permalink = true

[project.markdown_extensions.pymdownx.arithmatex]
generic = true

[project.markdown_extensions.pymdownx.betterem]

[project.markdown_extensions.pymdownx.caret]

[project.markdown_extensions.pymdownx.details]

[project.markdown_extensions.pymdownx.emoji]
emoji_generator = "zensical.extensions.emoji.to_svg"
emoji_index = "zensical.extensions.emoji.twemoji"

[project.markdown_extensions.pymdownx.highlight]
anchor_linenums = true
line_spans = "__span"
pygments_lang_class = true

[project.markdown_extensions.pymdownx.inlinehilite]

[project.markdown_extensions.pymdownx.keys]

[project.markdown_extensions.pymdownx.magiclink]

[project.markdown_extensions.pymdownx.mark]

[project.markdown_extensions.pymdownx.smartsymbols]

[project.markdown_extensions.pymdownx.snippets]
base_path = ["docs"]
check_paths = true

[project.markdown_extensions.pymdownx.superfences]
custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]

[project.markdown_extensions.pymdownx.tabbed]
alternate_style = true
combine_header_slug = true

[project.markdown_extensions.pymdownx.tasklist]
custom_checkbox = true

[project.markdown_extensions.pymdownx.tilde]
