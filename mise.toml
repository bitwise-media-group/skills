#
# skills — the Claude skill/plugin marketplace, its evaluation suite, and its
# Zensical docs site. The toolchain library (the .mise/ submodule) is loaded
# natively as .mise/config.toml (pinned developer tools, [settings] and the
# [vars] knob defaults); this file selects the task files: common/ -- no
# archetype, none fits a Markdown/plugin repo -- for the license/prose/
# container/shell/workflow lint, then tasks.toml, which adds this repo's own
# lint/test/build/ci/pr gates, the evolve eval tiers (triggers/evals/all/
# report, reading .evolve.json at the root) and the docs-site tasks (docs-gen/
# docs-build/serve/docs). The Makefile is a thin forwarder
# (.mise/common/include.mk).
#
# evolve is pinned directly below: it's a first-party CLI, but this repo is
# its only consumer, so there's no reuse-across-repos case for a shared pin in
# the toolchain library. So are the three agent CLIs the eval tiers drive
# (claude, codex, gemini): the evals workflow installs exactly these pins, so a
# CI run and a local `mise run evals` grade the same harness versions, and
# Renovate bumps them like any other pin.
#
# lockfile = true is already inherited from .mise/config.toml, but this repo
# has its own [tools] entries to lock, so it's set explicitly here too: mise
# writes per-platform checksums for them into this repo's own mise.lock,
# independent of the toolchain library's mise.lock for its shared [tools].
# Regenerate a pin's entries with `mise lock <tool>` -- never a bare
# `mise lock` or `mise upgrade`, which would also write into the .mise/
# submodule.
[settings]
lockfile = true

[task_config]
includes = [".mise/common/tasks.toml", "tasks.toml"]

[tools]
"github:bitwise-media-group/evolve" = "v0.8.4"
# claude-code uses the `github:` backend, not `aqua:`: mise <= 2026.8.5 has a
# bug merging the aqua registry's per-OS `overrides` for this package (the
# Linux entries only set `variants`, not `format`, and mise fails to inherit
# the parent `format: tar.gz` -- it installs the raw, unextracted tar.gz
# renamed to `claude` instead of the binary inside it, so `claude` -- and
# `mise run plugin-validate` -- fails with "Syntax error" on Linux only,
# since it's actually being shell-interpreted). The `github:` backend
# resolves the OS/arch asset directly against the release without going
# through that override-merge path, and adds attestation/provenance
# verification on top of the checksum. Fixed upstream by jdx/mise#11925 and
# jdx/mise#11931 (in mise 2026.8.6), but the CI reusable workflow currently
# pins an older mise -- switch back to `aqua:` once it's bumped past 2026.8.6.
"github:anthropics/claude-code" = "v2.1.314"
# codex ships prebuilt release binaries (checksummed via the aqua registry);
# gemini-cli is a Node bundle with no native binaries, so it installs from npm
# on the toolchain's shared node.
"aqua:openai/codex" = "0.160.0"
"npm:@google/gemini-cli" = "0.66.0"
