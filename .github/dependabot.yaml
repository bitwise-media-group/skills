# Opens the dependency PRs that dependabot-merge.yml fast-forwards once CI is green.
# Two ecosystems: the SHA/tag-pinned actions in the workflow callers and the shared
# Makefile library submodule (make/) — which carries the pinned Go CLIs (addlicense
# + the evolve eval CLI), replacing the old tools/go.mod + go.work. There is no npm
# ecosystem: the repo has no package.json — every CLI (claude included, via
# aqua:anthropics/claude-code) is a mise pin. The many go.mod files under
# plugins/*/evals are intentionally pinned test fixtures and are deliberately left
# untracked.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: daily
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns:
          - actions/*
      bitwise-media-group:
        patterns:
          - bitwise-media-group/*

  # The pinned Go CLIs (addlicense, evolve) no longer live in a tools/go.mod —
  # they come from the make/ submodule's .<tool>-version pins. Track the submodule
  # so a library release (a new `release` branch head) flows here as a bump.
  - package-ecosystem: gitsubmodule
    directory: /
    schedule:
      interval: daily
    cooldown:
      default-days: 7
      # our own make/ submodule ships straight through — no cooldown wait
      exclude:
        - make
    commit-message:
      include: scope
      prefix: build
      prefix-development: build
