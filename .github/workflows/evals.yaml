name: evals

# Tier 1 (trigger accuracy) and Tier 2 (behavioral) evals run real headless
# agent sessions, so they cost tokens and need provider API keys — manual only.
# Anthropic models run via `claude`, OpenAI via `codex`, Google via `gemini`;
# models whose CLI/key is unavailable get token counts only.
on:
  workflow_dispatch:
    inputs:
      skill:
        description: Only evaluate this skill (blank = all)
        required: false
        type: string
      tier:
        description: Which tiers to run
        required: true
        default: triggers
        type: choice
        options: [triggers, evals, both]
      models:
        description: Models to evaluate (provider names, model ids, or "all")
        required: true
        default: anthropic
        type: string

# the job only checks out the repo and uploads an artifact; neither needs write
# scope, so pin the token to the read-only minimum
permissions:
  contents: read

jobs:
  evals:
    runs-on: ubuntu-latest
    env:
      # Either Anthropic credential works: the claude CLI and the token-counting
      # client accept an API key or a long-lived OAuth token (claude setup-token).
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # nothing here pushes, and the results artifact must never carry a token
          persist-credentials: false
          submodules: true # the toolchain at .mise/, which pins node, terraform and tflint
      # Every tool comes from a mise pin, verified against mise.lock: evolve and the
      # agent CLIs under evaluation (claude, codex, gemini) from the root mise.toml,
      # and node (gemini's runtime) plus terraform + tflint (deterministic grading)
      # from the toolchain. Same mise as github-workflows v7.0.0's ci job.
      - name: Install evolve, the agent CLIs and the grading tools
        uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          version: v2026.10.3
          # sha256 of the linux-x64 mise binary for the version above, from the release's
          # SHASUMS256.txt -- the action verifies the extracted binary, not the archive
          sha256: 8d48bc510b7d844fad0bc7156c0855c2a1e7230c51e498a7f6b63b021f8b57c5
          install_args: >-
            github:bitwise-media-group/evolve
            github:anthropics/claude-code
            aqua:openai/codex
            node
            npm:@google/gemini-cli
            aqua:hashicorp/terraform
            aqua:terraform-linters/tflint
          cache_key_prefix: mise-evals
      # the free-text inputs reach the shell as env vars, never as expanded
      # template text, so a crafted value can't inject commands
      - name: Tier 1 — trigger accuracy
        if: ${{ inputs.tier == 'triggers' || inputs.tier == 'both' }}
        env:
          MODELS: ${{ inputs.models }}
          SKILL: ${{ inputs.skill }}
        run: |
          evolve run triggers \
            --models "$MODELS" \
            ${SKILL:+--skill "$SKILL"}
      - name: Tier 2 — behavioral evals
        if: ${{ inputs.tier == 'evals' || inputs.tier == 'both' }}
        env:
          MODELS: ${{ inputs.models }}
          SKILL: ${{ inputs.skill }}
        run: |
          evolve run evals \
            --models "$MODELS" \
            ${SKILL:+--skill "$SKILL"}
      - name: Regenerate reports
        if: always()
        run: evolve report
      - name: Upload results and reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: eval-results
          path: |
            plugins/*/evals/*/results.json
            EVALUATION.md
            EVALUATION.json
            plugins/*/EVALUATION.md
          if-no-files-found: ignore
