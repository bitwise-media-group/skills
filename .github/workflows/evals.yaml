name: evals

# Tier 1 (trigger accuracy) and Tier 2 (behavioral) evals run real headless
# agent sessions, so they cost tokens and need provider API keys — manual only.
# Anthropic models run via `claude`, OpenAI via `codex`, Google via `gemini`;
# models whose CLI/key is unavailable get token counts only.
on:
  workflow_dispatch:
    inputs:
      skill:
        description: Only evaluate this skill (blank = all)
        required: false
        type: string
      tier:
        description: Which tiers to run
        required: true
        default: triggers
        type: choice
        options: [triggers, evals, both]
      models:
        description: Models to evaluate (provider names, model ids, or "all")
        required: true
        default: anthropic
        type: string

# the job only checks out the repo and uploads an artifact; neither needs write
# scope, so pin the token to the read-only minimum
permissions:
  contents: read

jobs:
  evals:
    runs-on: ubuntu-latest
    env:
      # Either Anthropic credential works: the claude CLI and the token-counting
      # client accept an API key or a long-lived OAuth token (claude setup-token).
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # nothing here pushes, and the results artifact must never carry a token
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
      - uses: bitwise-media-group/setup-evolve@7f828c3b7c00edac7fc60b041440d87846a8856a # v1
      - name: Install the agent CLIs under evaluation
        run: npm install -g @anthropic-ai/claude-code @openai/codex @google/gemini-cli # zizmor: ignore[adhoc-packages] -- accepted: the harnesses under evaluation, deliberately latest; manual dispatch only
      - name: Install terraform + tflint for deterministic grading
        if: ${{ inputs.tier != 'triggers' }}
        run: |
          sudo snap install terraform --classic || true
          curl -s https://raw.githubusercontent.com/terraform-linters/tflint/master/install_linux.sh | bash || true
      # the free-text inputs reach the shell as env vars, never as expanded
      # template text, so a crafted value can't inject commands
      - name: Tier 1 — trigger accuracy
        if: ${{ inputs.tier == 'triggers' || inputs.tier == 'both' }}
        env:
          MODELS: ${{ inputs.models }}
          SKILL: ${{ inputs.skill }}
        run: |
          evolve run triggers \
            --models "$MODELS" \
            ${SKILL:+--skill "$SKILL"}
      - name: Tier 2 — behavioral evals
        if: ${{ inputs.tier == 'evals' || inputs.tier == 'both' }}
        env:
          MODELS: ${{ inputs.models }}
          SKILL: ${{ inputs.skill }}
        run: |
          evolve run evals \
            --models "$MODELS" \
            ${SKILL:+--skill "$SKILL"}
      - name: Regenerate reports
        if: always()
        run: evolve report
      - name: Upload results and reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: eval-results
          path: |
            plugins/*/evals/*/results.json
            EVALUATION.md
            EVALUATION.json
            plugins/*/EVALUATION.md
          if-no-files-found: ignore
