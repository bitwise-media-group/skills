# Caller for the reusable CI workflow. It owns the push/pull_request triggers;
# the reusable workflow discovers which canonical mise tasks this repo defines
# (`mise tasks ls --name-only`) and runs `mise run <task>` for each as one job.
# The tasks come from the toolchain submodule's common tasks plus tasks.toml:
# `lint` (prose + license + workflow lint + evolve Tier 0 --strict + eval-JSON
# + plugin validate + install.sh parse + generated-docs freshness), `test`
# (evolve checks + report --check), and `build` (renders the Zensical docs
# site, so a broken site fails the PR rather than the release's Pages deploy).
#
# coverage: false — this is a skills library, it emits no coverage, so the Codecov
# upload job is skipped.
#
# Keep `name: ci`: the merge.yaml caller keys its workflow_run trigger on this
# workflow's name — dependency PRs come from this repo's own Renovate workflow
# (renovate.yaml) and ride the same merge flow.
name: ci

on:
  push:
    branches: [main]
  pull_request:

# the reusable workflow's jobs only need contents:read; grant just that ceiling
permissions:
  contents: read

jobs:
  ci:
    uses: bitwise-media-group/github-workflows/.github/workflows/ci.yaml@437369afd3c617ae0cd06085e281574c7eb560a2 # v8.0.1
    with:
      coverage: false # skills library — no coverage to upload
