# Caller for the reusable CI workflow. It owns the push/pull_request triggers;
# the reusable workflow discovers which canonical mise tasks this repo defines
# (`mise tasks ls --name-only`) and runs each as one job. The tasks come from
# the toolchain submodule's agent-plugins archetype plus tasks.toml: `lint`
# (prose + evolve Tier 0 --strict + eval-JSON + license + plugin validate +
# install.sh parse) and `test` (evolve checks + report --check); there is no
# build task, so that leg is skipped.
#
# coverage: false — this is a skills library, it emits no coverage, so the Codecov
# upload job is skipped.
#
# Keep `name: ci`: the merge.yaml and dependabot-merge.yaml callers key their
# workflow_run triggers on this workflow's name.
name: ci

on:
  push:
    branches: [main]
  pull_request:

# the reusable workflow's jobs only need contents:read; grant just that ceiling
permissions:
  contents: read

jobs:
  ci:
    uses: bitwise-media-group/github-workflows/.github/workflows/ci.yaml@1eaff010e2929a3583c50ffa325690216bc70462 # v6.2.0
    with:
      coverage: false # skills library — no coverage to upload
