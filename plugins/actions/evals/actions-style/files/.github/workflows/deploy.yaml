name: Deploy

on:
  workflow_dispatch:
    inputs:
      run_tests:
        description: Run the test suite before deploying.
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Test
        if: ${{ inputs.run_tests }}
        run: make test

      - name: Deploy
        run: make deploy
